<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 
  Equilibrium #3429

  Our Equilibrium collection promotes balance and calm.

  0.041 ETH
  3 days left
  
  Creation of Jules Wyvern 
  -->


    <article>
      <img class="nft-img" src="./images/image-equilibrium.jpg" alt="NFT illustrative image.">
      <h2> Equilibrium #3429</h2>
      <p class="description"> Our Equilibrium collection promotes balance and calm.</p>
      <div class="data-nft">
        <div class="price">
          <img src="./images/icon-ethereum.svg" alt="Etherium icon">
          <strong>0.041 ETH</strong>
        </div>
        <div class="time">
          <img src="./images/icon-clock.svg" alt="Clock icon">
          <span>3 days left</span>
        </div>
      </div>

      <hr>

      <div class="avatar">
        <img src="./images/image-avatar.png" alt="User image">
        <p> Creation of <strong>Jules Wyvern</strong> </p>
      </div>
    </article>

    <!-- <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Sophie Alahí</a>.
    </footer> -->

  </div>


</body>

</html>
